# Builds the installable apps:
#   • Convert.ipa — unsigned, for SideStore / Sideloadly / AltStore (they sign it with your Apple ID)
#   • Convert.apk — Android debug build, install directly
# and attaches them to a GitHub Release ("Latest").
#
# You only need to re-run this when the NATIVE side changes (Capacitor plugins, app name/icon,
# capacitor.config.json). Normal code changes reach installed apps through the self-updater.
name: Build iOS + Android apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - capacitor.config.json
      - scripts/ios-plist.sh
      - assets/**
      - .github/workflows/native.yml

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
      - id: ver
        run: echo "version=$(node -p "require('./build/www/version.json').version")" >> "$GITHUB_OUTPUT"
      - run: npx cap add ios
      - name: App icon + splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#121110' --splashBackgroundColor '#121110' --splashBackgroundColorDark '#121110'
      - run: npx cap sync ios
      - run: bash scripts/ios-plist.sh
      - name: Build unsigned IPA
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET=(-workspace App.xcworkspace); else TARGET=(-project App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${VERSION##*.}" \
            build | tail -n 30
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Convert.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Convert.ipa

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
      - run: npx cap add android
      - name: App icon + splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#121110' --splashBackgroundColor '#121110' --splashBackgroundColorDark '#121110'
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Convert.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Convert.apk

  release:
    needs: [ios, android]
    if: ${{ always() && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ needs.ios.outputs.version || github.run_number }}
          name: Convert ${{ needs.ios.outputs.version || github.run_number }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/Convert.ipa
            dist/Convert.apk
          body: |
            **iPhone:** download `Convert.ipa` and install with SideStore (or Sideloadly).
            **Android:** download `Convert.apk` and open it.

            Installed apps update themselves from GitHub Pages after this — you only need a new install when this release's native shell changes.
